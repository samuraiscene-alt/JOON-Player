name: JOON Player Web Smoke

on:
  push:
    branches: [main]
    paths:
      - "Web/**"
      - ".github/workflows/web-smoke.yml"
  pull_request:
    paths:
      - "Web/**"
      - ".github/workflows/web-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: node --check Web/app.js

      - name: Validate manifest
        run: python -m json.tool Web/manifest.webmanifest > /dev/null

      - name: Validate DOM element wiring
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          app = Path("Web/app.js").read_text(encoding="utf-8")
          html = Path("Web/index.html").read_text(encoding="utf-8")

          ids_match = re.search(r'const ids = \[(.*?)\];', app, re.S)
          if not ids_match:
              raise SystemExit("Could not find the ids registry in Web/app.js")

          registered = set(re.findall(r'"([^"]+)"', ids_match.group(1)))
          referenced = set(re.findall(r'\be\.([A-Za-z0-9_]+)', app))
          html_id_list = re.findall(r'id="([^"]+)"', html)
          html_ids = set(html_id_list)

          missing_registry = sorted(referenced - registered)
          missing_html = sorted(registered - html_ids)
          duplicate_html_ids = sorted({
              value for value in html_id_list if html_id_list.count(value) > 1
          })

          if missing_registry:
              raise SystemExit(
                  "e.* references missing from ids registry: " + ", ".join(missing_registry)
              )

          if missing_html:
              raise SystemExit(
                  "Registered ids missing from index.html: " + ", ".join(missing_html)
              )

          if duplicate_html_ids:
              raise SystemExit(
                  "Duplicate ids in index.html: " + ", ".join(duplicate_html_ids)
              )

          shell_match = re.search(r'const SHELL = \[(.*?)\];', Path("Web/sw.js").read_text(encoding="utf-8"), re.S)
          if not shell_match:
              raise SystemExit("Could not find service-worker SHELL list")

          shell_entries = set(re.findall(r'"([^"]+)"', shell_match.group(1)))
          required_shell = {"./", "./index.html", "./app.js", "./manifest.webmanifest", "./icon.svg"}
          missing_shell = sorted(required_shell - shell_entries)

          if missing_shell:
              raise SystemExit(
                  "Required PWA shell files missing from service worker: " + ", ".join(missing_shell)
              )

          print(
              f"DOM wiring OK: {len(registered)} registered elements; "
              f"PWA shell OK: {len(shell_entries)} entries"
          )
          PY

      - name: Verify required files
        run: |
          test -f Web/index.html
          test -f Web/app.js
          test -f Web/manifest.webmanifest
          test -f Web/sw.js
          test -f Web/icon.svg
